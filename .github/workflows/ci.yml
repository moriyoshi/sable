name: sable CI

# Operationalizes the internal-ABI commitment (see README "Supported Go toolchains"):
#   * verify — full suite on every CERTIFIED Go version × arch.
#   * go-tip — early-warning tripwire for the NEXT Go release (allowed to fail).
#
# When `go-tip` starts failing, a coming Go release breaks an internal we rely
# on: run `make abi-check` locally on it to see which canary, and fix/adapt
# before it lands in a stable release.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, to catch tip drift even without commits
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with SupportedGoVersions in guard.go.
        go: ["1.26.4"]
        runner: [ubuntu-24.04, ubuntu-24.04-arm] # amd64 + arm64 native
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "${{ matrix.go }}"
      - uses: dtolnay/rust-toolchain@stable
      - name: Full verify (abi-check + suite + safe variant + http)
        run: make verify-all

  # macOS certification — the same full gate as `verify`, on the self-pipe
  # doorbell (#[cfg(not linux)]) and kqueue netpoll. The fast path now compiles
  # and runs on macOS (the eventfd port lives outside the doorbell), and the
  # Go suite skips its Linux-only /proc probes off Linux, so `make verify-all`
  # (abi-check + fast + safe + pipe + http) passes end-to-end.
  #
  # Apple-Silicon (macos-14) only: it exercises the macOS-specific seams
  # (kqueue netpoll, self-pipe doorbell) that are arch-independent, and the amd64
  # ABI is already covered by the Linux verify matrix — so a macOS/amd64 leg adds
  # little. GitHub's Intel (macos-13) runners are also scarce enough to stall CI.
  verify-macos:
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with SupportedGoVersions in guard.go.
        go: ["1.26.4"]
        runner: [macos-14] # arm64 (Apple Silicon)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "${{ matrix.go }}"
      - uses: dtolnay/rust-toolchain@stable
      - name: Full verify (abi-check + suite + safe variant + http)
        run: make verify-all

  # Windows tripwire. Windows has no fd/self-pipe model, so the Rust doorbell
  # (rust/src/doorbell.rs) is still `std::os::unix`-only and the portable
  # staticlib does not build there yet — the IOCP-associated doorbell handle is
  # an unimplemented follow-on (README "Operating-system support"). Rather than
  # an allowed-to-fail job (which still shows a red ✗ on the PR), this ASSERTS
  # the known gap: it is GREEN while the gap stands and turns RED the day the
  # build starts working — the signal to promote it into a real Windows
  # build + `go test -tags sable_portable` job. The inverse of the go-tip
  # tripwire: green means "the platform state is still as documented".
  windows-portable-tripwire:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Assert the portable staticlib still doesn't build (unix-only doorbell)
        run: |
          if cargo build --release --manifest-path rust/Cargo.toml \
               --no-default-features --features demo \
               --target-dir rust/target-portable 2> build.log; then
            echo "::error::Windows portable staticlib now BUILDS — the IOCP doorbell gap may be closed. Promote this tripwire to a real build + 'go test -tags sable_portable' job (and add a '#cgo windows LDFLAGS' line for the staticlib's system libs)."
            exit 1
          fi
          if grep -qE 'os::unix|RawFd' build.log; then
            echo "::notice::Expected: the portable staticlib does not build on Windows yet — the self-pipe doorbell is std::os::unix-only and the IOCP handle is a follow-on (README 'Operating-system support'). Tracking the gap."
            echo '----- cargo build stderr (tail) -----'
            tail -n 30 build.log || true
          else
            echo "::error::Windows build failed, but NOT at the known unix-only doorbell gap — a new/unexpected failure. Investigate:"
            tail -n 60 build.log || true
            exit 1
          fi

  # Concurrency + memory-safety cores (see README "Verification"). Arch-independent,
  # so one runner suffices.
  verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - uses: dtolnay/rust-toolchain@stable
      - name: Loom — model-check the await-slot wakeup protocol (all interleavings)
        run: make loom
      - name: Fuzz — the Call FFI byte-buffer boundary (bounded)
        run: make fuzz FUZZTIME=60s
      - name: Archive any fuzz failure corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: testdata/fuzz/

  # Miri UB-check of the Call pointer lifecycle. Nightly — allowed to fail if a
  # nightly regresses; the invariants it checks are also exercised under stable
  # `cargo test` (minus UB instrumentation).
  miri:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Miri — UB/leak/double-free check of the Call ABI pointer lifecycle
        run: make miri

  # Real rust2go integration (examples/rust2go.md): rust2go's g2r typed crossing
  # onto Sable's fused runtime. Opt-in; the generated Go binding is committed, so
  # this needs only the crate + Go module (no rust2go-cli). Allowed to fail — it
  # depends on an external Go module that can drift independently of Sable.
  rust2go:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build + test the real rust2go binding (relaxed cgo checks, as rust2go requires)
        env:
          SABLE_ALLOW_UNVERIFIED_GO: "1"
        run: make test-rust2go

  # Tripwire: does the code still build/certify on Go tip? Allowed to fail.
  go-tip:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Install gotip
        run: |
          go install golang.org/dl/gotip@latest
          gotip download
      - uses: dtolnay/rust-toolchain@stable
      - name: Certify Go tip (canaries only; unverified ABI is expected)
        env:
          SABLE_ALLOW_UNVERIFIED_GO: "1"
        run: |
          cargo build --release --manifest-path rust/Cargo.toml
          # Go tip dropped the //go:linkname push directives on
          # internal/runtime/atomic.* (Load/Load64/Cas/Xchg/Store64), so under the
          # default -checklinkname=1 the linker rejects our pulls of them
          # (park.go's g0-safe await-slot atomics). That is a linker POLICY change,
          # not an ABI/behavior change — the primitives still work. This tripwire's
          # job is to certify that BEHAVIOR via the canaries, so relax the policy
          # here to let them link and run. The certified `verify` job keeps the
          # default -checklinkname=1 as the real gate for shipped code.
          gotip test -ldflags=-checklinkname=0 -race -count=1 -run '^TestCanary' -v .
